
name: CI/CD

on:
  push:
    branches:
      - dev
      - staging
      - production
  pull_request:
    branches:
      - dev
      - staging
      - production

env:
  IMAGE: ghcr.io/seysane/observability-platform-app

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run tests
        run: pytest app/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy with Ansible
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Configure Ansible Vault password
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ANSIBLE_VAULT_PASSWORD" ]; then
            echo "Missing ANSIBLE_VAULT_PASSWORD secret"
            exit 1
          fi

          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > ansible/.vault_pass
          chmod 600 ansible/.vault_pass

      
      - name: Deploy application
        working-directory: ansible
        env:
          APP_TAG: sha-${{ github.sha }}
        run: ansible-playbook site.yml -e "app_tag=${APP_TAG}" --vault-password-file .vault_pass

      - name: Deploy observability stack
        working-directory: ansible
        run: ansible-playbook site-observability.yml --vault-password-file .vault_pass

  notify:
    needs: [test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_DEPLOY: ${{ needs.deploy.result }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ "$RESULT_TEST" = "success" ] &&
             [ "$RESULT_BUILD" = "success" ] &&
             { [ "$RESULT_DEPLOY" = "success" ] || [ "$RESULT_DEPLOY" = "skipped" ]; }; then
            STATUS="SUCCESS"
            COLOR=3066993
          else
            STATUS="FAILED"
            COLOR=15158332
          fi

          DESC=$(printf 'Branch: %s\nCommit: %s\nTests: %s\nBuild: %s\nDeploy: %s' \
            "$BRANCH" "${SHA:0:7}" "$RESULT_TEST" "$RESULT_BUILD" "$RESULT_DEPLOY")

          PAYLOAD=$(jq -n \
            --arg title "CI/CD: $STATUS" \
            --arg desc "$DESC" \
            --arg url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: $color}]}')

          if [ -n "$WEBHOOK" ]; then
            curl -fsS -H "Content-Type: application/json" \
              -d "$PAYLOAD" "$WEBHOOK"
          else
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
          fi
