<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Order desk{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <span class="brand">Order desk</span>
      <nav aria-label="Main">
        <a href="{{ url_for('overview') }}" {% if request.endpoint == 'overview' %}aria-current="page"{% endif %}>Overview</a>
        <a href="{{ url_for('orders') }}" {% if request.endpoint in ('orders', 'create_order', 'edit_order', 'update_order', 'toggle_order', 'delete_order') %}aria-current="page"{% endif %}>Orders</a>
        <a href="{{ url_for('about') }}" {% if request.endpoint == 'about' %}aria-current="page"{% endif %}>About</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
